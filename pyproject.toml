[project]
name = "knowledge-forge"
version = "0.1.0"
description = "Build human-and-agent maintained OKF 0.2 knowledge bundles from PDFs."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "langchain>=1.3.15,<2",
  "langchain-openai>=1.1,<2",
  "langgraph>=1.0,<2",
  "openai>=2,<3",
  "pydantic>=2.12,<3",
  "pypdf>=6.0,<7",
  "python-dotenv>=1.1,<2",
  "pyyaml>=6.0,<7",
  "typer>=0.20,<1",
]

[project.scripts]
knowledge-forge = "knowledge_forge.cli:main"

[dependency-groups]
dev = [
  "httpx>=0.28,<1",
  "pytest>=9,<10",
  "pytest-cov>=7,<8",
  "ruff>=0.14,<1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/knowledge_forge"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
